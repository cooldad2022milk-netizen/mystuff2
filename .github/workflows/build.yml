name: Build and test

# Builds the mod, then boots it for real twice to catch crashes before anyone plays it:
#  * server: a headless dedicated server where fake players use every hybrid/devil move and every contract, and
#    every devil mob uses each of its moves (SmokeTest, gradlew runServer -PcsmSmoke)
#  * client: the game itself on a virtual display, touring every hybrid, devil and contract (DevShowcase,
#    gradlew runClient -PcsmShowcase -PcsmShowcaseAll) - this is what catches model/animation/render crashes
# Download the built mod from the run's "csm-mod-jar" artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --warning-mode=summary > build.log 2>&1 || { grep -E "error:|warning:|FAILED|What went wrong|Exception" -A4 build.log | head -300; tail -80 build.log; exit 1; }
          grep -E "error:|FAILED" build.log | head -50 || true
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: csm-mod-jar
          path: build/libs/*.jar
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf '%s\n' 'level-type=minecraft\:flat' 'online-mode=false' 'spawn-monsters=false' 'spawn-animals=false' \
            'spawn-npcs=false' 'generate-structures=false' 'max-tick-time=-1' 'view-distance=6' 'simulation-distance=6' \
            > run/server.properties
      - name: Smoke test (every move, devil and contract on a dedicated server)
        run: |
          set +e
          timeout 50m ./gradlew runServer -PcsmSmoke --stacktrace > server-console.log 2>&1
          echo "gradle exit: $?"
          exit 0
      - name: Results
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=server-console.log
          echo "===== compile / gradle errors ====="
          grep -E "error:|What went wrong|FAILURE" -A6 server-console.log | head -120 || true
          echo "===== [smoke] ====="
          grep -F "[smoke]" "$LOG" | grep -vF "[smoke] skip" | head -400 || true
          echo "===== skipped moves ====="
          grep -F "[smoke] skip" "$LOG" | head -150 || true
          echo "===== errors and exceptions ====="
          grep -nE "ERROR|Exception|Caused by|\sat com\.csm|broke and was stopped" "$LOG" | head -400 || true
          echo "===== crash reports ====="
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "--- $f"; head -150 "$f"; }; done
          echo "===== last lines ====="
          tail -40 "$LOG"
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then echo "::error::the server crashed"; exit 1; fi
          grep -qF "[smoke] DONE" "$LOG" || { echo "::error::the smoke test did not finish"; exit 1; }
          grep -F "[smoke] DONE" "$LOG" | grep -q "failures=0" || { echo "::error::moves failed (see above)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs
          path: |
            server-console.log
            run/logs/
            run/crash-reports/
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display and software OpenGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Prepare client
        run: |
          chmod +x gradlew
          mkdir -p run/config
          printf '%s\n' 'onboardAccessibility:false' 'pauseOnLostFocus:false' 'renderDistance:6' 'simulationDistance:6' \
            'narrator:0' 'tutorialStep:none' 'skipMultiplayerWarning:true' 'joinedFirstServer:true' 'maxFps:60' \
            'soundCategory_master:0.0' > run/options.txt
          printf '%s\n' 'earlyWindowControl = false' > run/config/fml.toml
      - name: Showcase (every hybrid, devil and contract in the real game)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: |
          set +e
          timeout 85m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PcsmShowcase -PcsmShowcaseAll --stacktrace > client-console.log 2>&1
          echo "gradle exit: $?"
          exit 0
      - name: Results
        if: always()
        run: |
          LOG=run/logs/latest.log
          [ -f "$LOG" ] || LOG=client-console.log
          echo "===== compile / gradle errors ====="
          grep -E "error:|What went wrong|FAILURE" -A6 client-console.log | head -120 || true
          echo "===== [showcase] problems ====="
          grep -E "\[showcase\] (FAIL|step at)|can't be used here|signed by holding" "$LOG" | head -200 || true
          echo "===== errors and exceptions ====="
          grep -nE "ERROR|Exception|Caused by|\sat com\.csm|\sat software\.bernie|broke and was stopped|GeckoLib" "$LOG" \
            | grep -vE "OpenAL|ALC|sound|Sound|realms|Realms|telemetry|YggdrasilAuthentication|authlib" | head -400 || true
          echo "===== crash reports ====="
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "--- $f"; head -200 "$f"; }; done
          echo "===== progress ====="
          grep -cF "[showcase] screenshot" "$LOG" || true
          grep -F "[showcase]" "$LOG" | tail -15 || true
          echo "===== last lines ====="
          tail -40 "$LOG"
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then echo "::error::the game crashed"; exit 1; fi
          grep -qF "[showcase] DONE" "$LOG" || { echo "::error::the showcase did not finish"; exit 1; }
          if grep -qE "\[showcase\] (FAIL|step at)|broke and was stopped" "$LOG"; then echo "::error::something failed (see above)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-logs
          path: |
            client-console.log
            run/logs/
            run/crash-reports/
          retention-days: 7
