plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // GeckoLib and PlayerAnimator both ship mixins; these let them remap in the dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // gradlew runClient -PcsmShowcase : scripted screenshot tour of every hybrid (see DevShowcase)
            if (project.hasProperty('csmShowcase')) {
                property 'csm.showcase', 'true'
                // -PcsmShowcaseTypes=whip,bomb : full tour of just these hybrids (the rest get a first-person pass)
                property 'csm.showcase.types', project.findProperty('csmShowcaseTypes') ?: ''
                // -PcsmShowcaseDevils=control,bat : the full devils (mob fight, then becoming them)
                property 'csm.showcase.devils', project.findProperty('csmShowcaseDevils') ?: ''
                // -PcsmShowcaseAll : a quick pass of every hybrid, every devil, then every contract (what CI runs)
                property 'csm.showcase.all', project.hasProperty('csmShowcaseAll') ? 'true' : 'false'
                args '--width', '1280', '--height', '720'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // gradlew runServer -PcsmSmoke : headless smoke test of every hybrid, devil and contract (see SmokeTest)
            if (project.hasProperty('csmSmoke')) {
                property 'csm.smoketest', 'true'
            }
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        name = 'KosmX (PlayerAnimator)'
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroup('dev.kosmx.player-anim')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
            geckolib_version       : geckolib_version, player_anim_version: player_anim_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
